name: DevSecOps CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: app/go.mod
      - name: Format check
        working-directory: app
        run: test -z "$(gofmt -l src)"
      - name: Unit tests
        working-directory: app
        run: go test ./...
      - name: Vet
        working-directory: app
        run: go vet ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
          generateSarif: "1"
      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          trivyignores: .trivyignore
          format: json
          output: trivy-fs-report.json
      - name: Trivy filesystem scan (Gate - Fail on High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.json
          if-no-files-found: ignore

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          output_format: cli,json
          output_file_path: console,checkov-report.json
      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.json
          if-no-files-found: ignore

  container-scan:
    runs-on: ubuntu-latest
    needs: [source-validation, secret-scan, sast, dependency-scan, terraform-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t devsecops-home-test:${{ github.sha }} ./app
      - name: Trivy image scan (Report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-home-test:${{ github.sha }}
          format: json
          output: trivy-image-report.json
      - name: Trivy image scan (Gate - Fail on High/Critical)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-home-test:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: table
      - name: Upload Container scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
          if-no-files-found: ignore

  dast:
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4
      - name: Start sample API
        run: |
          docker build -t sample-api ./app
          docker run -d --name sample-api -p 8080:8080 sample-api
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 2
          done
      - name: ZAP baseline (authorized local container)
        run: |
          docker run --rm --network host ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
          if-no-files-found: ignore
      - name: Stop sample API
        if: always()
        run: docker rm -f sample-api || true

  deployment-approval:
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    needs: [container-scan, dast]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deployment placeholder
        run: |
          echo "Security gates passed and production approval granted."
          echo "Implement ECR push and ECS update after environment-specific review."
